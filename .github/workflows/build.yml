name: Build SuperComplex

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # allows the workflow to push the APK back to the repo

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -d "$ANDROID_HOME" 2>/dev/null || { echo "SDK not preinstalled"; exit 1; }
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # Install the exact packages AGP 8.5 expects. The GitHub runner
          # image already ships most of these but make sure.
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "SDK ready:"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Provision gradle-wrapper.jar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar from upstream Gradle 8.9 release..."
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9/gradle/wrapper/gradle-wrapper.jar
            test -s gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      - name: Provision CI signing keystore
        env:
          SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          LOCAL_PROPS: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$LOCAL_PROPS" ]; then
            echo "Using repository signing secrets."
            printf '%s' "$SIGNING_KEY" | tr -d '\n' | base64 -d > app/release_keystore.jks
            printf '%s\n' "$LOCAL_PROPS" > local.properties
          else
            echo "No signing secrets found - generating a CI-only keystore."
            keytool -genkeypair -v \
              -keystore app/release_keystore.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias supercomplex-ci -storepass superci -keypass superci \
              -dname "CN=SuperComplex CI, OU=Build, O=SuperComplex, L=NA, ST=NA, C=NA"
            printf 'signingConfig.storeFile=app/release_keystore.jks\nsigningConfig.storePassword=superci\nsigningConfig.keyAlias=supercomplex-ci\nsigningConfig.keyPassword=superci\n' > local.properties
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace -x lint

      - name: Locate APK
        id: apk
        run: |
          set -e
          OUT="app/build/outputs/apk/release"
          ls -lh "$OUT" || true
          APK=$(find "$OUT" -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK at: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperComplex-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish APK into public/
        run: |
          set -e
          APK="${{ steps.apk.outputs.apk_path }}"
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/versionName = "//;s/"//')
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          mkdir -p public
          cp "$APK" "public/SuperComplex-${VERSION}.apk"
          SIZE=$(stat -c%s "public/SuperComplex-${VERSION}.apk")
          if [ "$SIZE" -lt 1000000 ]; then echo "::error::APK too small: $SIZE bytes"; exit 1; fi
          echo "Published APK: public/SuperComplex-${VERSION}.apk ($SIZE bytes)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "public/SuperComplex-${VERSION}.apk"
          if ! git diff --staged --quiet; then
            git commit -m "ci: publish SuperComplex APK ${VERSION} [skip ci]"
            git push
          else
            echo "No changes to push."
          fi
